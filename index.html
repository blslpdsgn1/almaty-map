<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f6f4ee"><title>Алматы — карта мест</title>
<style>
:root{--paper:#f6f4ee;--ink:#202821;--muted:#626b63;--line:#dcded5;--green:#245b43;--hotel:#176fbb;--warn:#975600}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,a{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d69313;outline-offset:2px}header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0;letter-spacing:-.7px}header small{color:var(--muted);font-size:13px}.share{border:1px solid var(--line);background:white;padding:10px 14px;border-radius:9px;min-height:44px}.layout{display:grid;grid-template-columns:minmax(340px,410px) 1fr;height:calc(100dvh - 66px)}aside{grid-column:1;grid-row:1;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}.tools{padding:16px 16px 12px}.search{width:100%;min-height:46px;border:1px solid var(--line);background:white;border-radius:9px;padding:10px 13px;color:var(--ink)}.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.filters button{min-height:44px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 11px;font-size:14px}.filters button[aria-pressed=true]{color:white;border-color:var(--green);background:var(--green)}.counter{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:12px}.list{overflow-y:auto;overscroll-behavior:contain;padding:0 16px 18px;flex:1}.place{border-top:1px solid var(--line);padding:4px 0}.place.active{background:#e7eee7;border-radius:8px;padding-left:8px;padding-right:8px}.select{border:0;background:none;color:inherit;display:flex;text-align:left;width:100%;padding:13px 0 11px;gap:11px;align-items:flex-start;min-height:64px}.number{display:flex;align-items:center;justify-content:center;flex:0 0 31px;height:31px;border-radius:50%;background:var(--green);color:white;font-size:13px;font-weight:700}.hotel .number{background:var(--hotel)}.uncertain .number{background:var(--warn)}.place strong{font-size:16px;display:block;font-weight:650}.type{display:block;font-size:12px;color:var(--muted);margin-top:3px}.checked{opacity:.65}.empty{padding:24px 0;color:var(--muted)}.map-panel{grid-column:2;grid-row:1;min-width:0;min-height:0;display:flex;flex-direction:column}.map-head{padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);min-height:74px}.map-head strong{font-size:17px;display:block}.map-head small{font-size:12px;color:var(--muted)}.reset{flex-shrink:0;min-height:44px;border:1px solid var(--line);border-radius:8px;background:white;padding:8px 12px}.map-wrap{position:relative;flex:1;min-height:180px;background:#e6e8df}iframe{width:100%;height:100%;border:0;display:block;position:absolute;inset:0}.loading{position:absolute;top:12px;left:12px;font-size:13px;background:white;border-radius:7px;padding:7px 10px;pointer-events:none;z-index:1;box-shadow:0 1px 6px #0002}.detail{padding:14px 18px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}.detail p{font-size:14px;margin:0 0 12px;color:var(--muted);max-width:900px}.detail .warning{color:#7d4b00}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions a,.actions button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:8px;text-decoration:none;font-size:14px;background:white;border:1px solid var(--line);color:var(--ink)}.actions .primary{background:var(--green);color:white;border-color:var(--green)}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-bottom:10px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--green)}.dot.hotel{background:var(--hotel)}.dot.uncertain{background:var(--warn)}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#202821;color:white;border-radius:9px;padding:12px 18px;z-index:5;max-width:90vw;font-size:14px}#toast:empty{display:none}.privacy{font-size:11px;color:var(--muted);margin-top:9px}.mobile-hint{display:none}
@media(max-width:720px){header{height:58px;padding:0 14px}h1{font-size:21px}header small{font-size:11px}.share{padding:8px 10px;font-size:13px}.layout{display:flex;flex-direction:column;height:calc(100dvh - 58px)}.map-panel{height:55%;flex:none;border-bottom:1px solid var(--line)}.map-head{padding:8px 12px;min-height:55px;gap:8px}.map-head strong{font-size:14px;line-height:1.25}.map-head small{font-size:11px}.reset{font-size:12px;padding:8px;min-height:40px}.map-wrap{min-height:130px}.detail{padding:9px 12px}.detail p{font-size:12px;line-height:1.35;margin-bottom:8px;max-height:4.05em;overflow:auto}.actions{gap:6px}.actions a,.actions button{font-size:12px;padding:8px 9px;min-height:44px}.legend{margin-bottom:6px;gap:8px;font-size:10px}.privacy{display:none}aside{flex:1;min-height:0;border-right:0}.tools{padding:10px 12px 8px}.search{min-height:42px;font-size:15px;padding:8px 11px}.filters{margin-top:7px;gap:5px;flex-wrap:nowrap;overflow:auto}.filters button{min-height:42px;font-size:12px;padding:7px 9px;white-space:nowrap}.counter{margin-top:6px;font-size:11px}.list{padding:0 12px max(16px,env(safe-area-inset-bottom))}.select{padding:10px 0;min-height:58px}.place strong{font-size:14px}.type{font-size:11px}.number{height:28px;flex-basis:28px;font-size:12px}.mobile-hint{display:block;color:var(--muted);font-size:11px}.map-panel.expanded{height:80%}}
@media(max-height:660px) and (max-width:720px){.map-panel{height:52%}.detail p,.legend{display:none}.map-head small{display:none}.tools{padding-top:6px}.map-head{min-height:48px}.map-wrap{min-height:100px}}
</style></head><body>
<header><div><h1>Алматы</h1><small>Места, прогулки и три отеля</small></div><button class="share" id="share">Поделиться</button></header>
<main class="layout">
<section class="map-panel" aria-label="Карта"><div class="map-head"><div><strong id="map-title">Все места на одной карте</strong><small id="map-subtitle">Выбери название в списке — покажем точку крупно</small></div><button class="reset" id="reset">Общий вид</button></div><div class="map-wrap"><div class="loading" id="loading">Загружаем Яндекс Карту…</div><iframe id="map" title="Яндекс Карта Алматы" allow="geolocation; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="detail" id="detail"></div></section>
<aside aria-label="Список мест"><div class="tools"><input class="search" id="search" type="search" placeholder="Найти место или отель" aria-label="Поиск по местам"><div class="filters" aria-label="Категории"><button data-filter="all" aria-pressed="true">Все · 20</button><button data-filter="hotel" aria-pressed="false">Отели · 3</button><button data-filter="city" aria-pressed="false">Город</button><button data-filter="mountain" aria-pressed="false">Горы</button><button data-filter="uncertain" aria-pressed="false">Уточнить</button></div><div class="counter"><span id="count"></span><span>Нажми на название ↓</span></div></div><div class="list" id="list"></div></aside>
</main><div id="toast" role="status" aria-live="polite"></div>
<script id="places-data" type="application/json">[{"number": 1, "label": "Zvezdnaya Eco", "kind": "hotel", "lon": 76.8761, "lat": 43.151724, "note": "Галамат, 795. Метка отеля, не подтверждённый въезд.", "original": "Zvezdnaya Eco"}, {"number": 2, "label": "SADU Hotel", "kind": "hotel", "lon": 76.931685, "lat": 43.214265, "note": "Аль-Фараби, 128/7.", "original": "SADU Hotel"}, {"number": 3, "label": "Qazaq Auyl", "kind": "hotel", "lon": 77.059924, "lat": 43.16279, "note": "Керей-Жанибек хандар, 586, Медеуское ущелье. Не одноимённая закрытая организация в 3-м микрорайоне.", "original": "Qazaq Auyl"}, {"number": 4, "label": "Терренкур — верхний участок", "kind": "sight", "lon": 76.975343, "lat": 43.206214, "note": "Ориентир верхней части протяжённой прогулочной зоны, не весь маршрут и не нижний вход.", "original": "Терренкур"}, {"number": 5, "label": "Есентай — ориентир Esentai Park", "kind": "sight", "lon": 76.930449, "lat": 43.22059, "note": "Метка парка как ориентира для участка набережной. Не весь берег и не подтверждённый спуск к воде.", "original": "Набережная Есентая"}, {"number": 6, "label": "Площадь Республики", "kind": "sight", "lon": 76.945429, "lat": 43.238201, "note": "Метка площади.", "original": "Площадь республики"}, {"number": 7, "label": "Стрит-арт — «Стена Батыра»", "kind": "sight", "lon": 76.943359, "lat": 43.261023, "note": "Панфилова, 101. Один конкретный объект для общей категории «Муралы и стрит-арты», не все муралы города.", "original": "Муралы и стрит-арты"}, {"number": 8, "label": "Большая Алматинка — FLOW Park", "kind": "sight", "lon": 76.88941, "lat": 43.192715, "note": "Ориентир участка у реки из предыдущего плана, не вся набережная и не гарантия спуска к воде.", "original": "Большая алматинка"}, {"number": 9, "label": "Кок-Тобе — парк на горе", "kind": "sight", "lon": 76.975627, "lat": 43.234265, "note": "Сам парк, не нижняя станция канатной дороги.", "original": "Кок-тебе!"}, {"number": 10, "label": "Медеу", "kind": "sight", "lon": 77.058373, "lat": 43.158241, "note": "При предыдущей проверке Медеу был отмечен как временно не работающий. Перед поездкой уточни текущий статус. Метка не означает разрешённый проход.", "original": "Медеу и Шымбулак"}, {"number": 11, "label": "Шымбулак — базовая зона", "kind": "sight", "lon": 77.080374, "lat": 43.128042, "note": "Базовая зона курорта, не геометрический центр горнолыжных склонов. Работа подъёмников и доступ на даты поездки этой картой не подтверждаются.", "original": "Медеу и Шымбулак"}, {"number": 12, "label": "Центральная мечеть Алматы", "kind": "sight", "lon": 76.953272, "lat": 43.268317, "note": "Пушкина, 16.", "original": "Мечеть Алматы"}, {"number": 13, "label": "Зелёный базар", "kind": "sight", "lon": 76.955214, "lat": 43.263168, "note": "Жибек Жолы, 53. Выбрана основная действующая карточка, не дубликат 55А с сомнительным статусом.", "original": "Зеленый базар"}, {"number": 14, "label": "Вознесенский кафедральный собор", "kind": "sight", "lon": 76.953187, "lat": 43.258781, "note": "Гоголя, 40В, в парке Панфиловцев.", "original": "Вознесенский кафедральный собор"}, {"number": 15, "label": "Наурызбай батыра, 8/4 — адрес из списка", "kind": "sight", "lon": 76.935072, "lat": 43.267716, "note": "В исходном сообщении: «Наузырбай батыра,8/4». В Яндекс Картах улица названа Наурызбай батыра. Номер 8/4 сохранён без замены на 84. Сам адрес подтверждён, совпадение атмосферного дворика с фотографией не подтверждено.", "original": "Улица Наузырбай батыра,8/4(прикольные заведения с дверьми)"}, {"number": 16, "label": "Панфилова / Кабанбай батыра — ориентир «яблок»", "kind": "sight", "lon": 76.9456, "lat": 43.249726, "note": "Метка пересечения по указанному пользователем району. Наличие подвесных яблок именно сейчас и точный отрезок декораций не подтверждены.", "original": "Улица Кабанбай батра Панфилова ниже(яблоки сверху)"}, {"number": 17, "label": "Район Сатпаева — Масанчи — Абая", "kind": "sight", "lon": 76.93093, "lat": 43.24136, "note": "Ориентир на пересечении Абая / Масанчи, а не одно отдельное заведение или весь прогулочный трек.", "original": "Сатпаева-масанчи-абая"}, {"number": 18, "label": "Парк имени 28 гвардейцев-панфиловцев", "kind": "sight", "lon": 76.953816, "lat": 43.25883, "note": "Метка самого парка. Собор отмечен отдельно рядом; для различения нужно приблизить карту.", "original": "Парк имени 28 панфиловцев"}, {"number": 19, "label": "Almaty Museum of Arts", "kind": "sight", "lon": 76.949094, "lat": 43.227186, "note": "Аль-Фараби, 28. Не музей Кастеева и не Музей Алматы.", "original": "Музей искусств Алматы"}, {"number": 20, "label": "«Целинный»", "kind": "sight", "lon": 76.929129, "lat": 43.248483, "note": "Магаз Масанчи, 59. Выбрана карточка культурного центра, не ошибочная адресная выдача Талбесик, 59.", "original": "Целинный"}]</script>
<script>
'use strict';
const points=JSON.parse(document.getElementById('places-data').textContent);
let current=null,filter='all',query='',timer,loadTimer;
const $=s=>document.querySelector(s),uncertain=new Set([15,16,17]),mountains=new Set([3,10,11]);
let visited=[];try{visited=JSON.parse(localStorage.getItem('almaty-visited')||'[]');if(!Array.isArray(visited))visited=[]}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function group(p){return p.kind==='hotel'?'hotel':uncertain.has(p.number)?'uncertain':'sight'}
function matches(p){return (filter==='all'||filter==='hotel'&&p.kind==='hotel'||filter==='city'&&p.kind!=='hotel'&&!mountains.has(p.number)||filter==='mountain'&&mountains.has(p.number)||filter==='uncertain'&&uncertain.has(p.number))&&(!query||(p.label+' '+p.note+' '+p.original).toLowerCase().includes(query))}
function shown(){return points.filter(matches)}
function paramsURL(base,obj){return base+'?'+new URLSearchParams(obj).toString()}
function pt(list){return list.map(p=>`${p.lon},${p.lat},${p.kind==='hotel'?'pm2blm':uncertain.has(p.number)?'pm2orm':'pm2gnm'}${p.number}`).join('~')}
function overviewURL(list,widget=true){return paramsURL(widget?'https://yandex.ru/map-widget/v1/':'https://yandex.ru/maps/',{ll:'76.978237,43.198180',z:innerWidth<=720?'10':'11',l:'map',lang:'ru_RU',pt:pt(list)})}
function selectedURL(p,widget=true){return paramsURL(widget?'https://yandex.ru/map-widget/v1/':'https://yandex.ru/maps/',{ll:`${p.lon},${p.lat}`,z:'16',l:'map',lang:'ru_RU',pt:`${p.lon},${p.lat},pm2rdm`})}
function routes(p){return {ya:paramsURL('https://yandex.ru/maps/',{rtext:`~${p.lat},${p.lon}`,rtt:'auto'}),google:paramsURL('https://www.google.com/maps/dir/',{api:'1',destination:`${p.lat},${p.lon}`})}}
function toast(t){$('#toast').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',4000)}
function renderList(){let list=shown();$('#count').textContent=`Показано ${list.length} из ${points.length}`;$('#list').innerHTML=list.length?list.map(p=>`<article class="place ${group(p)} ${current===p.number?'active':''} ${visited.includes(p.number)?'checked':''}" data-place="${p.number}"><button class="select" data-select="${p.number}" aria-pressed="${current===p.number}"><span class="number">${String(p.number).padStart(2,'0')}</span><span><strong>${esc(p.label)}</strong><span class="type">${p.kind==='hotel'?'Отель':uncertain.has(p.number)?'Ориентир · нужно уточнение':mountains.has(p.number)?'Горы':'Место в городе'}${visited.includes(p.number)?' · Уже были':''}</span></span></button></article>`).join(''):'<p class="empty">Ничего не найдено. Попробуй другое название.</p>'}
function loadMap(url){$('#loading').hidden=false;$('#loading').textContent='Загружаем Яндекс Карту…';clearTimeout(loadTimer);$('#map').src=url;loadTimer=setTimeout(()=>{$('#loading').textContent='Не видно карты? Открой её кнопкой ниже.'},18000)}
$('#map').addEventListener('load',()=>{clearTimeout(loadTimer);$('#loading').hidden=true});
function renderDetail(){let p=points.find(p=>p.number===current);if(p){let r=routes(p);$('#map-title').textContent=`${String(p.number).padStart(2,'0')} · ${p.label}`;$('#map-subtitle').textContent='На карте одна выбранная точка';$('#detail').innerHTML=`<p class="${uncertain.has(p.number)||p.number===10?'warning':''}">${esc(p.note)}</p><div class="actions"><a class="primary" target="_blank" rel="noopener" href="${esc(r.ya)}">Маршрут · Яндекс</a><a target="_blank" rel="noopener" href="${esc(r.google)}">Google Maps</a><button id="visit">${visited.includes(p.number)?'✓ Уже были':'Отметить: были'}</button></div>`;$('#visit').onclick=()=>{visited=visited.includes(p.number)?visited.filter(n=>n!==p.number):[...visited,p.number];try{localStorage.setItem('almaty-visited',JSON.stringify(visited))}catch(e){toast('Браузер не разрешил сохранить отметки')}renderList();renderDetail()}}else{$('#map-title').textContent=filter==='hotel'?'Три отеля на карте':filter==='all'?'Все места на одной карте':'Места выбранной категории';$('#map-subtitle').textContent='Выбери название в списке — покажем точку крупно';$('#detail').innerHTML=`<div class="legend"><span>В списке: </span><span><i class="dot hotel"></i>Отели</span><span><i class="dot"></i>Места</span><span><i class="dot uncertain"></i>Уточнить</span></div><p>Нажми на название в списке ниже. Откроется точка с пояснением и маршрутом. Подписи списка не перекрывают карту.</p><div class="actions"><a class="primary" target="_blank" rel="noopener" href="${esc(overviewURL(shown(),false))}">Открыть в Яндекс Картах</a><button id="expand">Увеличить карту</button></div><div class="privacy">Нужен интернет. Страница доступна по ссылке, без пароля. Статус работы мест проверь перед поездкой.</div>`;$('#expand').onclick=()=>{let e=$('.map-panel').classList.toggle('expanded');$('#expand').textContent=e?'Вернуть список':'Увеличить карту'}}}
function select(n,updateHash=true){current=n;let p=points.find(p=>p.number===n);renderList();renderDetail();loadMap(p?selectedURL(p):overviewURL(shown()));if(updateHash){try{history.replaceState(null,'',p?'#place-'+n:location.pathname+location.search)}catch(e){}}}
$('#list').addEventListener('click',e=>{let b=e.target.closest('[data-select]');if(b)select(Number(b.dataset.select))});
$('.filters').addEventListener('click',e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;$('.filters').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));select(null)});
$('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();select(null)});
$('#reset').onclick=()=>{query='';$('#search').value='';select(null)};
$('#share').onclick=async()=>{const url=location.href;if(!/^https?:/.test(url)){toast('Чтобы поделиться, отправь сам HTML-файл');return}try{if(navigator.share){await navigator.share({title:'Алматы — карта мест',url});return}if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('Ссылка скопирована');return}}catch(e){if(e.name==='AbortError')return}prompt('Скопируй ссылку на карту',url)};
window.addEventListener('hashchange',()=>{const n=Number(location.hash.replace('#place-',''));if(points.some(p=>p.number===n))select(n,false);else select(null,false)});
const initial=Number(location.hash.replace('#place-',''));select(points.some(p=>p.number===initial)?initial:null,false);
</script><noscript>Для интерактивной карты включи JavaScript. <a href="https://yandex.ru/maps/162/almaty/">Открыть Алматы в Яндекс Картах</a></noscript></body></html>
